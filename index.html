<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops the BROWSER from pinch-zooming the page itself
         (which scaled fixed UI chrome along with the canvas on Android).
         Canvas pinch-zoom is our own gesture (useTouchCanvasGestures).
         iOS Safari deliberately ignores this attribute for accessibility —
         there, the non-passive preventDefault in the gesture hook does the
         equivalent job for gestures that start on the canvas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MasterMind OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
